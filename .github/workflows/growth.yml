name: Growth review
# Weekly Growth Strategist review: is production moving InforMed toward the YouTube Partner Program and $1,000/day?
# Rewrites data/growth-playbook.md (read by every agent), tracks experiments, reports to Telegram.

on:
  schedule:
    - cron: "17 21 * * 0" # Sundays 21:17 UTC = Monday morning NZ, before the week's production
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: growth
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_FALLBACK_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # backup when the subscription is capped (never as ANTHROPIC_API_KEY: it would override the subscription)
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx tsx src/cli.ts growth
      - if: always()
        run: bash scripts/commit-data.sh "bot - growth review" || true
