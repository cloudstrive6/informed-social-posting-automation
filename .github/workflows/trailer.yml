name: Channel trailer
# Renders the YouTube Home-tab trailers from config/trailers/<name>.json (non-subscriber trailer and returning-
# subscriber featured video). The MP4s go to the `trailers` release and Telegram; the owner sets them in YouTube Studio.

on:
  workflow_dispatch:
    inputs:
      names:
        description: "Trailer names (space-separated files in config/trailers/, without .json)"
        default: "visitors subscribers"

permissions:
  contents: write

env:
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  ANTHROPIC_FALLBACK_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # backup when the subscription is capped (never as ANTHROPIC_API_KEY: it would override the subscription)
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
  GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
  GH_TOKEN: ${{ github.token }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  trailer:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { media: "true" }
      - env: { NAMES: "${{ inputs.names }}" }
        run: npx tsx src/cli.ts trailer $NAMES
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trailers
          path: out/trailers/*/final/
          if-no-files-found: ignore
          retention-days: 14
