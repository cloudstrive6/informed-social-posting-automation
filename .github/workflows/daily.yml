name: Daily production
# Plans today's slate, produces 3 long-form videos, 3 shorts and 2 carousels in parallel,
# then uploads media, pre-schedules YouTube and queues everything else for the publisher.

on:
  schedule:
    # 22:00 New York the evening before (EDT; 21:00 in winter), so even the long videos are ready well before
    # the first slots. Backups: GitHub sometimes drops scheduled runs; a backup exits if the run already started.
    - cron: "0 2 * * *"
    - cron: "30 2 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Content date (YYYY-MM-DD, audience timezone). Blank = today."
        required: false
      test_run:
        description: "Test run: produce + archive everything, but hold every item for review (nothing is scheduled or published)"
        type: boolean
        default: false
      only:
        description: "Produce only this kind (manual re-runs)"
        type: choice
        options: [all, long, short, carousel]
        default: all

permissions:
  contents: write
  issues: write
  actions: read # duplicate guard: see whether today's run already started

env:
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
  GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
  GH_TOKEN: ${{ github.token }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      date: ${{ steps.plan.outputs.date }}
      long: ${{ steps.plan.outputs.long }}
      short: ${{ steps.plan.outputs.short }}
      carousel: ${{ steps.plan.outputs.carousel }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Refresh radar if stale (> 6h)
        run: |
          if [ ! -f data/radar/latest.json ] || [ $(( $(date +%s) - $(date -d "$(jq -r .at data/radar/latest.json)" +%s) )) -gt 21600 ]; then npm run radar; fi
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      - id: plan
        run: |
          D="${{ inputs.date }}"
          # content date: tomorrow when started in the evening (anything within 6 h of midnight counts as tomorrow)
          if [ -z "$D" ]; then D=$(TZ=$(jq -r .audience.timezone config/channel.json) date -d "+6 hours" +%F); fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
          # duplicate guard for scheduled (and backup) starts: one production run per day
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SINCE=$(date -u -d "-6 hours" +%Y-%m-%dT%H:%M:%SZ)
            OTHERS=$(gh run list --workflow daily.yml --limit 20 --json databaseId,createdAt,status,conclusion \
              --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.createdAt >= \"$SINCE\") | select(.status != \"completed\" or .conclusion == \"success\")] | length")
            # only skip on a positive answer; if the check itself fails, produce anyway
            if [ -n "$OTHERS" ] && [ "$OTHERS" -gt 0 ] 2>/dev/null; then
              echo "Today's production already started in another run; skipping."
              { echo "long=[]"; echo "short=[]"; echo "carousel=[]"; echo "skip=true"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          npx tsx src/cli.ts plan --date "$D"
          # manual re-runs: blank out the kinds that weren't asked for
          ONLY="${{ inputs.only || 'all' }}"
          if [ "$ONLY" != "all" ]; then
            for k in long short carousel; do [ "$k" != "$ONLY" ] && sed -i "s/^$k=.*/$k=[]/" "$GITHUB_OUTPUT"; done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: data/
          include-hidden-files: true

  # Long videos start once the Shorts are done and run two at a time, so the day's Claude usage is spread out
  # instead of every job hitting the subscription's usage limit at once. Agents wait out a limit if one is hit anyway.
  long:
    needs: [plan, short]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.long != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        id: ${{ fromJson(needs.plan.outputs.long) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: plan, path: data/ }
      - uses: ./.github/actions/setup
        with: { media: "true" }
      - run: npx tsx src/cli.ts produce long ${{ matrix.id }} --date "${{ needs.plan.outputs.date }}"
      # anchor file keeps "out/" as the artifact root so the <date>/<id>/ structure survives
      - if: always()
        run: mkdir -p out && touch out/_root
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: item-${{ matrix.id }}
          path: |
            out/_root
            out/*/*/item.json
            out/*/*/final/
          if-no-files-found: ignore
          retention-days: 7

  short:
    needs: plan
    if: needs.plan.outputs.short != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.plan.outputs.short) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: plan, path: data/ }
      - uses: ./.github/actions/setup
        with: { media: "true" }
      - run: npx tsx src/cli.ts produce short ${{ matrix.id }} --date "${{ needs.plan.outputs.date }}"
      # anchor file keeps "out/" as the artifact root so the <date>/<id>/ structure survives
      - if: always()
        run: mkdir -p out && touch out/_root
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: item-${{ matrix.id }}
          path: |
            out/_root
            out/*/*/item.json
            out/*/*/final/
          if-no-files-found: ignore
          retention-days: 7

  carousel:
    needs: plan
    if: needs.plan.outputs.carousel != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.plan.outputs.carousel) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: plan, path: data/ }
      - uses: ./.github/actions/setup
        with: { media: "true" }
      - run: npx tsx src/cli.ts produce carousel ${{ matrix.id }} --date "${{ needs.plan.outputs.date }}"
      # anchor file keeps "out/" as the artifact root so the <date>/<id>/ structure survives
      - if: always()
        run: mkdir -p out && touch out/_root
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: item-${{ matrix.id }}
          path: |
            out/_root
            out/*/*/item.json
            out/*/*/final/
          if-no-files-found: ignore
          retention-days: 7

  finalize:
    needs: [plan, long, short, carousel]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { ffmpeg: "true" } # Telegram preview copies of large videos
      - uses: actions/download-artifact@v4
        with: { name: plan, path: data/ }
      - uses: actions/download-artifact@v4
        with:
          pattern: item-*
          path: out/
          merge-multiple: true
      - run: npx tsx src/cli.ts finalize --date "${{ needs.plan.outputs.date }}"
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          TEST_RUN: ${{ inputs.test_run && '1' || '' }}
      - if: always()
        run: bash scripts/commit-data.sh "bot - daily content ${{ needs.plan.outputs.date }}"
