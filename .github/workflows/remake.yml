name: Remake video
# Re-voice and re-render a Short or long video from its approved script with the current voice and visual engine
# (e.g. after a voice or style change). Runs entirely on GitHub, so it works from a phone or a cloud Claude session.
# Step 1 (replace_youtube off): renders a candidate, uploads it to the day's release as remake-<file>, and sends a
#   frame contact sheet + link to Telegram for review.
# Step 2 (replace_youtube on): renders, puts the new file in place of the old one in the release and replaces the
#   YouTube upload (old video deleted; same title, cleaned description, thumbnail, playlists). Refused if QA blocks.

on:
  workflow_dispatch:
    inputs:
      item:
        description: "Item to remake: <date>/<item-id> (a Short or long video)"
        required: true
      replace_youtube:
        description: "Also replace the YouTube upload with the remake (only if QA passes)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: remake-${{ inputs.item }}
  cancel-in-progress: false

env:
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  ANTHROPIC_FALLBACK_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # backup when the subscription is capped (never as ANTHROPIC_API_KEY: it would override the subscription)
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
  GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
  GH_TOKEN: ${{ github.token }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

jobs:
  remake:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { media: "true" }
      - name: Render
        id: render
        env: { ITEM: "${{ inputs.item }}" }
        run: |
          npx tsx src/cli.ts remake "$ITEM"
          id="${ITEM#*/}"; s="out/remake/$id/remake-summary.json"
          echo "file=$(jq -r .file "$s")" >> "$GITHUB_OUTPUT"
          echo "blocking=$(jq -c .blocking "$s")" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r .release_tag "data/queue/$ITEM.json")" >> "$GITHUB_OUTPUT"
      - name: Upload candidate + contact sheet, notify Telegram
        env:
          FILE: ${{ steps.render.outputs.file }}
          TAG: ${{ steps.render.outputs.tag }}
          BLOCKING: ${{ steps.render.outputs.blocking }}
          ITEM: ${{ inputs.item }}
        run: |
          name=$(basename "$FILE"); dir=$(dirname "$FILE")
          cp "$FILE" "$dir/remake-$name"
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$FILE")
          every=$(awk -v d="$dur" 'BEGIN{printf "%.2f", d/12}')
          ffmpeg -v error -y -i "$FILE" -vf "fps=1/$every,scale=480:-1,tile=4x3" -frames:v 1 "$dir/remake-sheet.jpg"
          gh release upload "$TAG" "$dir/remake-$name" "$dir/remake-sheet.jpg" --clobber
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/remake-$name"
          mins=$(awk -v d="$dur" 'BEGIN{printf "%.1f", d/60}')
          curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" -F chat_id="$TELEGRAM_CHAT_ID" \
            -F photo=@"$dir/remake-sheet.jpg" -F caption="🎬 Remake of $ITEM ready ($mins min). QA blocking: $BLOCKING. Watch: $url" || true
      - name: Replace on YouTube
        if: inputs.replace_youtube && steps.render.outputs.blocking == '[]'
        env:
          FILE: ${{ steps.render.outputs.file }}
          TAG: ${{ steps.render.outputs.tag }}
          ITEM: ${{ inputs.item }}
        run: |
          gh release upload "$TAG" "$FILE" --clobber
          npx tsx src/cli.ts youtube-replace "$ITEM"
      - if: inputs.replace_youtube && steps.render.outputs.blocking != '[]'
        run: echo "::error::QA found blocking issues; YouTube was not replaced. Review the candidate in the release." && exit 1
      - if: always()
        run: bash scripts/commit-data.sh "bot - remake ${{ inputs.item }}" || true
