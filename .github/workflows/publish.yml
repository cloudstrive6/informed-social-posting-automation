name: Publisher
# Always-on publisher: each run checks every minute for ~5.5 hours and posts whatever is due (within about a
# minute of its slot), then starts its successor. GitHub's own schedule can lag by hours, so the cron below is
# only a watchdog that restarts the loop if the chain ever breaks.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      item:
        description: "Publish this item right now (<date>/<item-id>), even if held. Blank = normal scheduled run."
        required: false
      platforms:
        description: "With `item`: comma-separated platforms (youtube,tiktok,instagram,facebook). Blank = all."
        required: false

permissions:
  contents: write
  issues: write
  actions: write # the loop starts its successor run

concurrency:
  group: publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { ffmpeg: "true" }
      - run: |
          if [ -n "${{ inputs.item }}" ]; then
            npx tsx src/cli.ts publish-now "${{ inputs.item }}" --platforms "${{ inputs.platforms }}"
            exit 0
          fi
          git config user.name "informed-bot"; git config user.email "informed-bot@users.noreply.github.com"
          END=$((SECONDS + 19800)) # ~5.5 h, then hand over to a fresh run
          while [ $SECONDS -lt $END ]; do
            git pull -q --rebase -X theirs origin main || git rebase --abort || true   # new items, decisions, vetoes
            npx tsx src/cli.ts publish || echo "publish cycle failed; retrying next minute"
            bash scripts/commit-data.sh "bot - publish" || true
            sleep 60
          done
          gh workflow run publish.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          POSTFORME_API_KEY: ${{ secrets.POSTFORME_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - if: always()
        run: bash scripts/commit-data.sh "bot - publish" || true
