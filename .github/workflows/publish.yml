name: Publisher
# Every 15 minutes: post everything whose time slot has arrived (Instagram, TikTok, Facebook;
# YouTube is pre-scheduled by the daily run but retried here if needed).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      item:
        description: "Publish this item right now (<date>/<item-id>), even if held. Blank = normal scheduled run."
        required: false
      platforms:
        description: "With `item`: comma-separated platforms (youtube,tiktok,instagram,facebook). Blank = all."
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: |
          if [ -n "${{ inputs.item }}" ]; then npx tsx src/cli.ts publish-now "${{ inputs.item }}" --platforms "${{ inputs.platforms }}"; else npm run publish; fi
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          POSTFORME_API_KEY: ${{ secrets.POSTFORME_API_KEY }}
      - if: always()
        run: bash scripts/commit-data.sh "bot - publish"
