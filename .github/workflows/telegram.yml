name: Telegram
# Listens for Telegram Approve / Reject taps: each run stays connected for ~4.5 minutes and a new run starts
# every 5, so taps are answered within seconds most of the time. A decision labels the review issue and is
# synced onto the queued item for the Publisher.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx tsx src/cli.ts telegram-poll 270
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - if: always()
        run: bash scripts/commit-data.sh "bot - telegram decisions"
