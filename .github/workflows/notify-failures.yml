name: Failure alerts
# Catch-all: any pipeline workflow that ends in failure (including crashes before our own error reporting runs)
# sends a Telegram alert with a link to the run.

on:
  workflow_run:
    workflows: ["Daily production", "Publisher", "Analytics & learnings", "Trend radar", "Human review", "Telegram", "Ops engineer"]
    types: [completed]

jobs:
  alert:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAME: ${{ github.event.workflow_run.name }}
          URL: ${{ github.event.workflow_run.html_url }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
        run: |
          [ -z "$TOKEN" ] && exit 0
          curl -s "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=🚨 Workflow \"$NAME\" ended: $RESULT
          $URL" > /dev/null
